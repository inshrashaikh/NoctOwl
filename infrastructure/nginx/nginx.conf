# NoctOwl Reverse Proxy Configuration (M0 Placeholder)
# Upstreams for web, api, and ai-service will be wired in M1+.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 503 "NoctOwl application services are not yet deployed (M0 foundation).\n";
            add_header Content-Type text/plain;
        }
    }
}
