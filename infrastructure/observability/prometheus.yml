global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:3000"]

  - job_name: "ai-service"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["ai-service:8000"]
