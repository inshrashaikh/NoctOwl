---
# yamllint disable rule:truthy
name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]

jobs:
  opencode-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for diff

      - name: Build OpenCode CI image
        run: |
          docker build \
            -t noctowl/opencode-ci \
            -f infrastructure/opencode/Dockerfile \
            .

      - name: Run OpenCode review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          docker run --rm \
            -e OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            -v "$PWD:/workspace" \
            -w /workspace \
            noctowl/opencode-ci \
            run --format json --auto \
              --model openrouter/anthropic/claude-sonnet-4-20250514 \
              "Review the git diff against origin/main. \
              Use the reviewer subagent. Report CRITICAL and HIGH findings \
              only. Output as markdown."
        continue-on-error: true

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## OpenCode Automated Review',
              '',
              'OpenCode review completed. Check the workflow logs for details.',
              '',
              '> This is an automated check. Human review still required.',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
