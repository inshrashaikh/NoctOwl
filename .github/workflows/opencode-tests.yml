---
# yamllint disable rule:truthy
name: OpenCode Test Generation

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Path to generate tests for (e.g. apps/api/src/geofencing)'
        required: true
        type: string

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build OpenCode CI image
        run: |
          docker build \
            -t noctowl/opencode-ci \
            -f infrastructure/opencode/Dockerfile \
            .

      - name: Generate tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          docker run --rm \
            -e OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            -e TARGET_PATH="$TARGET_PATH" \
            -v "$PWD:/workspace" \
            -w /workspace \
            noctowl/opencode-ci \
            run --format default --auto \
              --model openrouter/anthropic/claude-sonnet-4-20250514 \
              "Generate unit tests for $TARGET_PATH. \
              Follow the existing test patterns in the codebase. \
              Output only the test file content." \
            > generated-tests.md

      - name: Upload generated tests as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: generated-tests.md
          if-no-files-found: warn
