services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: noctowl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noctowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-noctowl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noctowl} -d ${POSTGRES_DB:-noctowl}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: noctowl-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: noctowl-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: noctowl-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-noctowl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noctowl}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: noctowl-valhalla
    volumes:
      - ./infrastructure/routing:/data
    command: valhalla_service /data/valhalla.json 2
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    container_name: noctowl-ai-service
    environment:
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: noctowl-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      SENTRY_DSN_WEB: ${SENTRY_DSN_WEB:-}
      NEXT_PUBLIC_SENTRY_DSN_WEB: ${NEXT_PUBLIC_SENTRY_DSN_WEB:-}
    networks:
      - noctowl-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: noctowl-prometheus
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - noctowl-net

  loki:
    image: grafana/loki:latest
    container_name: noctowl-loki
    volumes:
      - ./infrastructure/observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - noctowl-net

  backup:
    image: postgres:16-alpine
    container_name: noctowl-backup
    volumes:
      - ./infrastructure/scripts:/scripts:ro
      - backup_data:/backups
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-noctowl}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-noctowl}?schema=public
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-noctowl-backups}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-changeme}}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["/bin/sh"]
    command: ["-c", "apk add --no-cache minio-client && ln -sf /usr/bin/mcli /usr/local/bin/mc && while true; do /scripts/backup.sh || echo 'Backup attempt failed'; sleep 86400; done"]
    networks:
      - noctowl-net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  promtail:
    image: grafana/promtail:latest
    container_name: noctowl-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./infrastructure/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - noctowl-net

  grafana:
    image: grafana/grafana:latest
    container_name: noctowl-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - noctowl-net

networks:
  noctowl-net:
    name: noctowl-net
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
  backup_data:
